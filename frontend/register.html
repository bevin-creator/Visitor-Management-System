<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Management System Registration</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Visitor Management System</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="visitors.html">Visitors</a></li>
            <li><a href="register.html">Register</a></li>
        </ul>
    </nav>

    <main>
        <section id="registration">
            <h2>Visitor Registration</h2>
            <form id="regustration">
                <label for="fullname">Full name:</label>
                <input type="text" id="fullname" name="fullname" required>
                <span class="error" id="fullname-error"></span>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <span class="error" id="email-error"></span>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>
                <span class="error" id="phone-error"></span>

                <label for="purpose">Purpose of visit:</label>
                <select>
                    <option value="">--- Select Purpose ---</option>
                    <option value="meeting">Meeting</option>
                    <option value="delivery">Delivery</option>
                    <option value="interview">Ìnterview</option>
                    <option value="other">Other</option>
                </select>

                <label for="host">Host (Person/Department to visit):</label>
                <input type="text" id="host" name="host" required>
                <span class="error" id="host-error"></span>

                <button type="submit">Register Visitor</button>

            </form>
        </section>
        <aside>
            <h3>Instructions</h3>
            <p>Please fill in all fields. You will receive a confirmation once registerd</p>
        </aside>
    </main>

    <footer>
        <p>&copy; 2026 Visitor Management System. All rights reserved.</p>
    </footer>

    <script src="js/validation.js"></script>
</body>
</html>
