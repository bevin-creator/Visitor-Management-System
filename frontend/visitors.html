<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset= "UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Management System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Visitor Management System</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="visitors.html">Visitors</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="reports.html">Reports</a></li>
            <li><a href="#" id="logout-btn">Logout</a></li>
        </ul>
    </nav>

    <main>
        <section id="Visitors-list">
            <h2>Visitors Log</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>ID</th>
                        <th>Purpose</th>
                        <th>Host</th>
                        <th>Check-in Time</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="visitors-table-body">
                        <!--rows-->
                </tbody>
            </table>
            <p id="no-visitors" style="display:none;">No active visitors.</p>
            

        </section>

        <aside>
            <h3>Filter</h3>
            <p>Use search to find visitors</p>
        </aside>

    </main>

    <footer>
        <p>&copy; 2026 Visitor Management System. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>
    <script>
        requireAuth();
        applyRoleVisibility();

        async function loadActiveVisitors(){
            const response = await apiRequest("/checkin/active");
            if (!response || !response.ok)return;

            const visits = await response.json();
            const tbody = document.getElementById("visitors-table-body");
            const noVisitors = document.getElementById("no-visitors");

            tbody.innerHTML="";

            if (visits.length ===0) {
                noVisitors.style.display="block";
                return;
            }

            noVisitors.style.display="none";

            for (const visit of visits){
                const row = document.createElement("tr");
                const checkInTime = new Date(visit.check_in_time).toLocaleString();
                const idInfo = visit.visitor_id_type
                    ?`${visit.visitor_id_type}: ${visit.visitor_id_number || ""}`
                    : "N/A";

                row.innerHTML = `
                    <td>${visit.visitor_name}</td>
                    <td>${visit.visitor_phone}</td>
                    <td>${idInfo}</td>
                    <td>${visit.purpose}</td>
                    <td>${visit.host_name}</td>
                    <td>${checkInTime}</td>
                    <td>
                        <button onclick="checkOut(${visit.id})">Check Out</button>
                        ${getUserRole() === "admin" ? `<button onclick="deleteVisitor(${visit.visitor_id})" style="background:red;color:white;margin-left:0.5rem;">Delete</button>` : ""}
                    </td>
                `;
                tbody.appendChild(row);
            }
        }

        async function checkOut(visitRecordId) {
            const response = await apiRequest("/checkin/checkout", "POST", {
                visit_record_id: visitRecordId,

            });

            if (response && response.ok){
                loadActiveVisitors();
            }else{
                alert("Check-out failed!")
            }
            
        }

        //delete visitor - admin only, removes visitor and all visit records
        async function deleteVisitor(visitorId) {
            if (!confirm("Delete this visitor and all their records? This cannot be undone.")) return;

            const response = await apiRequest(`/visitors/${visitorId}`, "DELETE");

            if (response && response.status === 204) {
                loadActiveVisitors();
            } else {
                alert("Delete failed.");
            }
        }
        //logout
        document.getElementById("logout-btn").addEventListener("click", (e)=>{
            e.preventDefault();
            clearToken();
            window.location.href = "login.html";
        });

        loadActiveVisitors();
    </script>

</body>
</html>
