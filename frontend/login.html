<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VMS - Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Visitor Management System</h1>
    </header>

    <main class="auth-main">
        <section id="login-section">
            <img src="images/key.jpg" alt="Golden key representing secure access" style="width: 90px; display: block; margin: 0 auto 0.5rem;">
            <h2>Login</h2>
            <form id="login-form">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Login</button>
                <p id="login-error" class="error"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Visitor Management System. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>

    <script>
        document.getElementById("login-form").addEventListener("submit", async(e) =>{
            e.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const errorEl = document.getElementById("login-error");

            errorEl.textContent="";

            const response = await login(username, password)

            if (response.ok){
                const data = await response.json();
                saveToken(data.access_token);
                //store the role so pages can show/hide elements based on permissions
                localStorage.setItem("user_role", data.role);
                window.location.href = "index.html";
            }else{
                errorEl.textContent="Invalid username or password";
            }
        });
    </script>

</body>

</html>
