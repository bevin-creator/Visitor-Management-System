services:
  - type: web
    name: vms-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: vms-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false   # set manually to your Vercel URL after frontend deploys

databases:
  - name: vms-db
    plan: free
